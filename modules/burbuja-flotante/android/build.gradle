plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.burbujaflotante'
version = '0.1.0'

android {
  namespace "expo.modules.burbujaflotante"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  // Igual que la plantilla oficial de modulos locales de Expo
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  // Solo para tests unitarios del modulo (no entra en la app)
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
}
